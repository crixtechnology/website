<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#060B1A" />
  <!-- Tab / bookmark / search-result icon, in every size browsers and Google
       ask for (Google wants a square multiple of 48px). favicon.ico sits at
       the site root because many browsers and crawlers request it there
       directly, whatever the tags below say. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- Safari pinned tabs / Touch Bar: a one-colour vector of the emblem, tinted with the brand teal. -->
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#14C9C9" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Search-engine structured data. WebSite: the site name Google shows
       above results. Organization: the company, its logo and contact
       details (lets Google show the Crix logo beside the site's name). -->
  <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Crix Technology",
        "alternateName": ["Crix Technology Private Limited", "Crix"],
        "url": "https://www.crixtechnology.in/",
        "inLanguage": "en-IN"
      },
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://www.crixtechnology.in/#organization",
        "name": "Crix Technology Private Limited",
        "alternateName": "Crix Technology",
        "description": "Ahmedabad-based IT services and training company offering virtual internships, online courses with certificates, and website, app, AI and digital marketing services.",
        "areaServed": { "@type": "Country", "name": "India" },
        "knowsAbout": [
          "Website development", "Web application development", "Mobile app development", "Android app development",
          "E-commerce websites", "Website redesign", "AI and machine learning solutions", "Chatbot development",
          "Digital marketing", "Search engine optimization", "IT consulting",
          "Virtual internships", "MERN stack", "React.js", "Node.js", "MongoDB", "SQL", "Python",
          "AI agents", "Retrieval-augmented generation (RAG)", "LangChain", "Kotlin", "Java", "React Native", "Flutter"
        ],
        "url": "https://www.crixtechnology.in/",
        "logo": "https://www.crixtechnology.in/icon-512.png",
        "image": "https://www.crixtechnology.in/og-image.png",
        "email": "crixtechnology@gmail.com",
        "telephone": "+91-97232-23588",
        "contactPoint": [
          { "@type": "ContactPoint", "telephone": "+91-97232-23588", "contactType": "customer service", "areaServed": "IN", "availableLanguage": "English" }
        ],
        "address": { "@type": "PostalAddress", "streetAddress": "G-403, Jalaram Vatika, Nr. Sadguru Bunglows, New Maninagar, Ramol", "addressLocality": "Ahmedabad", "addressRegion": "Gujarat", "postalCode": "382449", "addressCountry": "IN" },
        "sameAs": ["https://www.linkedin.com/company/crix-technology/", "https://www.instagram.com/crix_technology"]
      }
    ]
  </script>
  <!-- Home page defaults. scripts/prerender-meta.js rewrites the title,
       description, canonical and social tags below into a separate HTML file
       for every public page after each build (from src/data/seo.json), and
       src/hooks/usePageMeta.js keeps them in sync while browsing. -->
  <title>Virtual Internships, Courses & IT Services | Crix Technology</title>
  <meta name="description" content="Virtual internships, industry-ready online courses and IT services by Crix Technology, Ahmedabad. Hands-on MERN stack & AI programs with certificates." />
  <meta name="keywords" content="virtual internship India, virtual internship program, online courses with certificate, IT services Ahmedabad, software company Ahmedabad, MERN stack internship, AI internship, web development internship, internship with offer letter, Crix Technology" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://www.crixtechnology.in/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Crix Technology" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:url" content="https://www.crixtechnology.in/" />
  <meta property="og:title" content="Virtual Internships, Courses & IT Services | Crix Technology" />
  <meta property="og:description" content="Virtual internships, industry-ready online courses and IT services by Crix Technology, Ahmedabad. Hands-on MERN stack & AI programs with certificates." />
  <meta property="og:image" content="https://www.crixtechnology.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Crix Technology — virtual internships, IT services and online courses" />
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:description" content="Virtual internships, industry-ready online courses and IT services by Crix Technology, Ahmedabad. Hands-on MERN stack & AI programs with certificates." />
  <meta name="twitter:image" content="https://www.crixtechnology.in/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* The pre-app splash in #root (see <body>): brand colours, centred. */
    .seo-shell{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#060B1A;color:#E8EEF7;font-family:Sora,system-ui,sans-serif}
    .seo-shell h1{margin:0;font-family:Unbounded,Sora,sans-serif;font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.25;max-width:26ch}
    .seo-shell p{margin:0;max-width:60ch;color:#93A3BC;font-size:.95rem;line-height:1.6}
    .seo-shell nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:.85rem}
    .seo-shell a{color:#7FE8E0;text-decoration:none}
    [data-theme="light"] .seo-shell{background:#F5F7FB;color:#101B33}
    [data-theme="light"] .seo-shell p{color:#55627A}
    [data-theme="light"] .seo-shell a{color:#0A7A74}
  </style>
  <script>
    // Applies a saved light-mode preference before the page paints, so
    // there's no flash of the (default) dark theme on load for someone who
    // picked light last time — see src/context/ThemeContext.jsx, which is
    // the only other place that reads/writes this same key. Dark needs no
    // entry here: it's simply the absence of data-theme, matching the
    // site's un-themed default look in global.css.
    (function () {
      try {
        if (localStorage.getItem("crix_theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- The page's real heading, summary and main links, as plain HTML inside
       #root, for crawlers that don't run JavaScript (Bing flags pages whose
       only <h1> comes from the app). prerender-meta.js fills these per page.
       The app replaces all of it the moment it starts (createRoot), so
       visitors only see it as a brief splash while the script loads. -->
  <div id="root">
    <div class="seo-shell">
      <h1 id="seo-h1">Crix Technology — virtual internships, online courses &amp; IT services</h1>
      <p id="seo-desc">Virtual internships, industry-ready online courses and IT services by Crix Technology, Ahmedabad. Hands-on MERN stack &amp; AI programs with certificates.</p>
      <nav aria-label="Main">
        <a href="/">Home</a> <a href="/programs">Internships &amp; Courses</a> <a href="/services">IT Services</a>
        <a href="/about">About</a> <a href="/contact">Contact</a> <a href="/ambassador">Campus Ambassador</a>
      </nav>
    </div>
  </div>
</body>
</html>
