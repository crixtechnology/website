<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#060B1A" />
  <!-- Tab / bookmark / search-result icon, in every size browsers and Google
       ask for (Google wants a square multiple of 48px). favicon.ico sits at
       the site root because many browsers and crawlers request it there
       directly, whatever the tags below say. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Organization details for search engines: lets Google show the Crix
       logo beside the site's name/link in results. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Crix Technology Private Limited",
      "alternateName": "Crix Technology",
      "url": "https://crixtechnology.in/",
      "logo": "https://crixtechnology.in/icon-512.png",
      "email": "crixtechnology@gmail.com",
      "address": { "@type": "PostalAddress", "addressLocality": "Ahmedabad", "addressRegion": "Gujarat", "postalCode": "382449", "addressCountry": "IN" },
      "sameAs": ["https://www.linkedin.com/company/crix-technology/", "https://www.instagram.com/crix_technology"]
    }
  </script>
  <title>Crix Technology | Virtual Internships, IT Services & Online Courses — Ahmedabad</title>
  <meta name="description" content="Crix Technology — India's platform for virtual internships, cutting-edge IT services, and industry-ready online courses. Structured, hands-on programs in MERN stack and AI Agentic Systems. Based in Ahmedabad, serving all of India." />
  <meta name="keywords" content="virtual internship India, IT services Ahmedabad, online courses, web development internship, AI ML internship, MERN stack training" />
  <link rel="canonical" href="https://crixtechnology.in/" />
  <!-- Static baseline for link-preview bots that don't execute JS (WhatsApp,
       Slack, iMessage, etc.) — src/hooks/usePageMeta.js overwrites these
       per-route for everything else, including real browsers/crawlers. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Crix Technology" />
  <meta property="og:url" content="https://crixtechnology.in/" />
  <meta property="og:title" content="Crix Technology | Virtual Internships, IT Services & Online Courses — Ahmedabad" />
  <meta property="og:description" content="Crix Technology — India's platform for virtual internships, cutting-edge IT services, and industry-ready online courses. Structured, hands-on programs in MERN stack and AI Agentic Systems. Based in Ahmedabad, serving all of India." />
  <meta property="og:image" content="https://crixtechnology.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Crix Technology — virtual internships, IT services and online courses" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Crix Technology | Virtual Internships, IT Services & Online Courses — Ahmedabad" />
  <meta name="twitter:description" content="Crix Technology — India's platform for virtual internships, cutting-edge IT services, and industry-ready online courses." />
  <meta name="twitter:image" content="https://crixtechnology.in/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    // Applies a saved light-mode preference before the page paints, so
    // there's no flash of the (default) dark theme on load for someone who
    // picked light last time — see src/context/ThemeContext.jsx, which is
    // the only other place that reads/writes this same key. Dark needs no
    // entry here: it's simply the absence of data-theme, matching the
    // site's un-themed default look in global.css.
    (function () {
      try {
        if (localStorage.getItem("crix_theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
