  <!-- Tab / bookmark / search-result icon, in every size browsers and Google
       ask for (Google wants a square multiple of 48px). favicon.ico sits at

  <link rel="icon" href="/favicon.ico" sizes="48x48" />

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- Safari pinned tabs / Touch Bar: a one-colour vector of the emblem, tinted with the brand teal. -->
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#14C9C9" />
  <link rel="manifest" href="/site.webmanifest" />

  <script type="application/ld+json">

  <!-- Home page defaults. scripts/prerender-meta.js rewrites the title,
       description, canonical and social tags below into a separate HTML file
       for every public page after each build (from src/data/seo.json), and
       src/hooks/usePageMeta.js keeps them in sync while browsing. -->
  <title>Virtual Internships, Courses & IT Services | Crix Technology</title>

  <meta property="og:site_name" content="Crix Technology" />

  <script>
    // Applies a saved light-mode preference before the page paints, so
    // there's no flash of the (default) dark theme on load for someone who
    // picked light last time — see src/context/ThemeContext.jsx, which is
    // the only other place that reads/writes this same key. Dark needs no
    // entry here: it's simply the absence of data-theme, matching the
    // site's un-themed default look in global.css.
    (function () {
      try {
        if (localStorage.getItem("crix_theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
