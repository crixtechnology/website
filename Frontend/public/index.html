  <!-- Static baseline for link-preview bots that don't execute JS (WhatsApp,
       Slack, iMessage, etc.) — src/hooks/usePageMeta.js overwrites these
       per-route for everything else, including real browsers/crawlers. -->

  <meta property="og:description" content="Crix Technology — India's platform for virtual internships, cutting-edge IT services, and industry-ready online courses. Structured, hands-on programs in MERN stack and AI Agentic Systems. Based in Ahmedabad, serving all of India." />
  <meta property="og:image" content="https://crixtechnology.in/crix-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script>
    // Applies a saved light-mode preference before the page paints, so
    // there's no flash of the (default) dark theme on load for someone who
    // picked light last time — see src/context/ThemeContext.jsx, which is
    // the only other place that reads/writes this same key. Dark needs no
    // entry here: it's simply the absence of data-theme, matching the
    // site's un-themed default look in global.css.
    (function () {
      try {
        if (localStorage.getItem("crix_theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
</head>
